<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda — Mundo Mágico CM</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../../static/img/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="../../" class="brand">
        <img src="../../static/img/mundomagicomascote.png" alt="Mundo Mágico CM" />
        <span>Mundo Mágico <strong>CM</strong></span>
      </a>
      <nav class="menu">
        <a href="../../">Ver site</a>
        <a href="#" data-sair><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
      </nav>
    </header>

    <main>
      <section class="admin">
        <div class="admin-head">
          <div>
            <h1>Agenda</h1>
            <p class="admin-subtitulo">Eventos marcados e datas bloqueadas.</p>
          </div>
          <a href="../" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        </div>

        <nav class="admin-nav" aria-label="Navegação administrativa">
          <a href="../"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
          <a href="./"><i class="fa-solid fa-calendar-days"></i> Agenda</a>
          <a href="../administradores/" data-so-dono hidden><i class="fa-solid fa-user-shield"></i> Equipe</a>
        </nav>

        <div class="admin-card">
          <div class="agenda-nav">
            <button class="btn btn-ghost btn-sm" data-mes-anterior><i class="fa-solid fa-chevron-left"></i></button>
            <h2 data-mes-titulo>...</h2>
            <button class="btn btn-ghost btn-sm" data-mes-proximo><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div data-calendario><p class="vazio">Carregando...</p></div>
        </div>

        <div class="admin-card">
          <h2><i class="fa-solid fa-ban"></i> Bloquear uma data</h2>
          <form class="form-brinquedo" data-form-bloqueio>
            <label>Data<input type="date" name="data" required /></label>
            <label>Tipo
              <select name="tipo">
                <option value="dia">Dia inteiro</option>
                <option value="parcial">Alguns horários</option>
              </select></label>
            <label>Quantos horários<input type="number" name="slots" min="1" max="3" value="1" /></label>
            <label class="full">Motivo<input type="text" name="motivo" placeholder="Manutenção, viagem, evento particular..." /></label>
            <button type="submit" class="btn btn-primary">Bloquear</button>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../static/js/config.js"></script>
    <script src="../../static/js/api.js"></script>
    <script src="../../static/js/auth.js"></script>
    <script src="../../static/js/painel-agenda.js"></script>
  </body>
</html>
