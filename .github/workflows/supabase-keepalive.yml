# Projeto Supabase no plano gratuito pausa após 1 semana sem atividade, e um
# projeto pausado derruba o site: catálogo não carrega e login para de funcionar.
# Este ping a cada 3 dias mantém o projeto acordado com folga.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  a chave anon/public do projeto
#
# Atenção: em repositório público o GitHub desativa agendamentos após 60 dias
# sem commits. Se isso acontecer, o próprio painel do Actions oferece reativar.

name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Defina os segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi

          codigo=$(curl -sS -o /tmp/resposta.json -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/brinquedos?select=id&limit=1")

          echo "HTTP ${codigo}"

          # 200 = acordado. Qualquer outra coisa merece falhar para você receber
          # o e-mail de workflow quebrado em vez de descobrir pelo cliente.
          if [ "${codigo}" != "200" ]; then
            echo "Resposta inesperada do Supabase:"
            cat /tmp/resposta.json
            exit 1
          fi

          echo "Projeto ativo."
